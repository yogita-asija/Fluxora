# Mounted as /etc/nginx/conf.d/default.conf (http context).

# Docker's embedded DNS. Re-resolving lets Nginx pick up API replicas as they are
# added, removed, or restarted (e.g. `docker compose up -d --scale api=4`).
resolver 127.0.0.11 valid=10s ipv6=off;

# `api` resolves to one address per replica; `resolve` makes Nginx balance across all of them.
# (`resolve` in open-source Nginx needs 1.27.3+.)
upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve;
    keepalive 16;
}

upstream frontend_app {
    zone frontend_app 64k;
    server frontend:80 resolve;
}

# Per-IP rate limit for login/registration. The API also locks an account after repeated
# failed logins; this layer slows credential stuffing and sign-up spam from a single address.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    client_max_body_size 1m;

    # Inherited by every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Shows which replica handled a request; handy for demonstrating load balancing.
    # (A location that defines its own add_header drops these, so `location /` repeats them.)
    add_header X-Upstream $upstream_addr always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://api_backend;
    }

    location /api/ {
        proxy_pass http://api_backend;
    }

    location /health/ {
        proxy_pass http://api_backend;
    }

    # /metrics is deliberately not routed: Prometheus scrapes each replica directly.

    # The React app. The CSP allows only same-origin scripts, styles, and API calls, which
    # limits the damage an XSS bug could do (the API token lives in sessionStorage).
    # Not applied to /api/ because the dev-only Swagger UI there loads scripts from a CDN.
    location / {
        proxy_pass http://frontend_app;
        add_header X-Upstream $upstream_addr always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
